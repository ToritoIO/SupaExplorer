<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SupaExplorer - Supabase Database Explorer Network Bridge</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
        font-size: 14px;
        --font-mono: "SF Mono", "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
        --bg: #09090b;
        --fg: #fafafa;
        --border: rgba(255, 255, 255, 0.06);
        --border-strong: rgba(255, 255, 255, 0.1);
        --muted: #71717a;
        --accent: #3b82f6;
        --accent-dark: #2563eb;
        --button-bg: rgba(255, 255, 255, 0.04);
        --button-bg-hover: rgba(255, 255, 255, 0.08);
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: var(--bg);
        color: var(--fg);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
      }
      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      button {
        height: 28px;
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0 10px;
        font-size: 0.75rem;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      button:hover:not(:disabled) {
        background: var(--button-bg-hover);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button.primary {
        background: var(--accent);
        border-color: transparent;
        color: #fff;
      }
      button.primary:hover:not(:disabled) {
        background: var(--accent-dark);
      }
      #status {
        padding: 6px 16px;
        font-size: 0.75rem;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
        min-height: 18px;
      }
      .tab-bar {
        display: flex;
        gap: 4px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
      }
      .tab-bar button {
        background: transparent;
        border: none;
        color: var(--muted);
        font-size: 0.8125rem;
        font-weight: 500;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        transition: color 0.15s ease, background 0.15s ease;
      }
      .tab-bar button:hover {
        color: var(--fg);
        background: var(--button-bg);
      }
      .tab-bar button.active {
        color: var(--fg);
        background: var(--button-bg-hover);
      }
      #request-list {
        width: 260px;
        flex: 0 0 260px;
        min-height: 0;
        overflow-y: auto;
        border-right: 1px solid var(--border);
        padding: 4px 0;
        display: flex;
        flex-direction: column;
      }
      .panel-layout {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      #request-detail {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 16px 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .request-nav-item {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        padding: 10px 16px;
        background: transparent;
        border: none;
        border-left: 2px solid transparent;
        border-radius: 0;
        color: var(--muted);
        font-size: 0.75rem;
        text-align: left;
        cursor: pointer;
        height: auto;
        transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      }
      .request-nav-item:hover {
        background: var(--button-bg);
        color: var(--fg);
      }
      .request-nav-item.active {
        border-left-color: var(--accent);
        background: var(--button-bg-hover);
        color: var(--fg);
      }
      .request-nav-item:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .request-nav-item.request .nav-method {
        color: var(--accent);
      }
      .request-nav-item.asset .nav-method {
        color: #fbbf24;
      }
      .request-nav-item.leak .nav-method {
        color: #f87171;
      }
      .nav-top {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: 0.6875rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: inherit;
      }
      .nav-method {
        font-weight: 600;
      }
      .nav-status {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-family: var(--font-mono);
      }
      .nav-url {
        width: 100%;
        font-family: var(--font-mono);
        font-size: 0.6875rem;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .nav-meta {
        font-size: 0.6875rem;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .nav-empty {
        padding: 24px 16px;
        text-align: left;
        color: var(--muted);
        font-size: 0.75rem;
      }
      .detail-empty {
        margin-top: 24px;
        align-self: center;
        max-width: 420px;
        text-align: center;
        color: var(--muted);
        font-size: 0.8125rem;
      }
      .request-card {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px;
        margin: 0;
      }
      .request-card.request {
        border-left: 2px solid rgba(59, 130, 246, 0.4);
      }
      .request-card.asset {
        border-left: 2px solid rgba(251, 191, 36, 0.4);
      }
      .request-card.leak {
        border-left: 2px solid rgba(248, 113, 113, 0.4);
      }
      .request-card.sending {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.2);
      }
      .request-header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 8px;
      }
      .request-method {
        font-weight: 600;
        color: var(--accent);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .request-card.asset .request-method {
        color: #fbbf24;
      }
      .request-card.leak .request-method {
        color: #f87171;
      }
      .request-url {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        word-break: break-all;
        color: var(--fg);
      }
      .request-meta {
        font-size: 0.75rem;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .header-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 0.75rem;
      }
      .header-name {
        color: var(--muted);
      }
      .header-value {
        font-family: var(--font-mono);
        word-break: break-all;
        flex: 1;
        text-align: right;
      }
      .header-list {
        display: grid;
        grid-template-columns: 1fr;
        gap: 3px;
        margin-bottom: 12px;
      }
      .header-actions {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .filter-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.75rem;
        color: var(--muted);
      }
      .filter-toggle input {
        accent-color: var(--accent);
      }
      .actions {
        display: flex;
        justify-content: flex-end;
      }
      .empty-state {
        padding: 24px 16px;
        text-align: center;
        color: var(--muted);
        font-size: 0.75rem;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.14);
      }

      ::selection {
        background: rgba(59, 130, 246, 0.25);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>SupaExplorer Network Bridge</h1>
      <div class="header-actions">
        <button id="open-sidepanel-btn" class="primary" type="button">Open SupaExplorer</button>
        <label class="filter-toggle">
          <input id="auth-filter-checkbox" type="checkbox" checked />
          Only auth headers
        </label>
        <button id="clear-btn" type="button">Clear</button>
      </div>
    </header>
    <div id="status">Requests and detections will appear as the page makes network calls.</div>
    <div class="tab-bar">
      <button class="tab-btn active" type="button" data-tab="requests">Requests (0)</button>
      <button class="tab-btn" type="button" data-tab="assets">Assets (0)</button>
      <button class="tab-btn" type="button" data-tab="leaks">Leaks (0)</button>
    </div>
    <div class="panel-layout">
      <aside id="request-list"></aside>
      <section id="request-detail">
        <div class="empty-state detail-empty">Select a request, asset, or leak to see its details.</div>
      </section>
    </div>
    <template id="nav-item-template">
      <button class="request-nav-item" type="button">
        <div class="nav-top">
          <span class="nav-method"></span>
          <span class="nav-status"></span>
        </div>
        <div class="nav-url"></div>
        <div class="nav-meta"></div>
      </button>
    </template>
    <template id="request-template">
      <div class="request-card">
        <div class="request-header">
          <span class="request-method"></span>
          <button class="send-btn" type="button">Send to SupaExplorer</button>
        </div>
        <div class="request-url"></div>
        <div class="request-meta"></div>
        <div class="header-list"></div>
      </div>
    </template>
    <script type="module" src="devtools_panel.js"></script>
  </body>
</html>
